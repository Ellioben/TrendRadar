name: Deploy to GitHub Pages

on:
  schedule:
    # 设置北京时间 12:20 和 22:20 执行 (UTC时间 04:20 和 14:20)
    - cron: '20 4 * * *'   # UTC 4:20 = 北京时间 12:20
    - cron: '20 14 * * *'  # UTC 14:20 = 北京时间 22:20
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [ main ]  # 当main分支有推送时也触发，确保内容最新

env:  # 为整个工作流设置环境变量
  TZ: Asia/Shanghai  # 设置时区为上海时间 (北京时间):cite[10]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}  # 确保有写入权限
        fetch-depth: 0  # 获取所有历史记录，便于rebase等操作

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install Flask

    - name: Generate static files
      run: |
        python main.py --generate-json

    - name: Setup Git User  # 设置Git用户信息，为提交做准备
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        # 使用GITHUB_TOKEN有助正确触发Pages构建
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        # 可选：强制推送以覆盖历史，避免因历史分歧导致推送失败
        force_orphan: true
